name: Backend tests

# pytest against a throwaway Postgres service container. No live LLM, no live
# Razorpay, no Supabase network — every adapter is mock/local (mvp-spec.md §18.1;
# docs/ai-touchpoints.md: this wave has zero production AI hops).

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiproposer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aiproposer
      SUPABASE_JWT_ALG: HS256
      SUPABASE_JWT_SECRET: ci-only-secret
      SUPABASE_JWT_AUD: authenticated
      AI_PROVIDER: mock
      PAYMENTS_PROVIDER: mock
      STORAGE_PROVIDER: local
      EMAIL_PROVIDER: mock
      RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate (Postgres)
        working-directory: backend
        run: PYTHONPATH=. python -m alembic upgrade head

      - name: Run pytest
        working-directory: backend
        run: PYTHONPATH=. python -m pytest -q
